version: "0.3.2"

required_fields:
  - File
  - Description
  - Component
  - Module
  - Layer
  - Requirements
  - API
  - Author
  - Created

date_format: "DD-MM-YYYY"

special_files:
  ".githooks/pre-commit": shell

header_exempt_files:
  - requirements.txt

exclude:
  directories:
    - .git
    - build
    - out
    - third_party
    - vendor
    - generated
    - external
  files:
    - LICENSE
    - NOTICE
    - CHANGELOG.md
